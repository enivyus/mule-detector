server:
  port: 8080
  address: 127.0.0.1  # HTTP Basic over plain HTTP (see SecurityConfig), so never listen beyond this machine

spring:
  application:
    name: core-banking
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mulebank}
    username: ${DB_USER:mulebank}
    password: ${DB_PASSWORD:mulebank}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  # Used only with the "kafka" profile (see TransferEventPublisher)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      properties:
        max.block.ms: 5000  # fail fast instead of stalling requests for 60 s when the broker is down

mulebank:
  passwords:  # local dev defaults; set the env vars anywhere else
    channel: ${CHANNEL_PASSWORD:channel-dev}
    investigator: ${INVESTIGATOR_PASSWORD:investigator-dev}
    rule-engine: ${RULE_ENGINE_PASSWORD:rule-engine-dev}
