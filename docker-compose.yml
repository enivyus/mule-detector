# Local infrastructure. Week 1-4 only need postgres:
#   docker compose up -d postgres
# Everything (from week 5):
#   docker compose --profile full up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mulebank
      POSTGRES_USER: mulebank
      POSTGRES_PASSWORD: mulebank
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mulebank -d mulebank"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    profiles: ["full"]
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      # Two listeners: containers use redpanda:29092, apps on the host use localhost:9092
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:29092,external://localhost:9092
    ports:
      - "9092:9092"

  redpanda-console:
    profiles: ["full"]
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "8081:8080"
    depends_on:
      - redpanda

  neo4j:
    profiles: ["full"]
    image: neo4j:5.24-community
    environment:
      NEO4J_AUTH: neo4j/mulebank-dev
      NEO4J_PLUGINS: '["graph-data-science"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data

volumes:
  pgdata:
  neo4jdata:
