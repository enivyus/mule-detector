server:
  port: 8082  # 8080 is core-banking, 8081 is the Redpanda console
  address: 127.0.0.1  # HTTP Basic over plain HTTP (see SecurityConfig), so local only

spring:
  application:
    name: rule-engine
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: rule-engine
      auto-offset-reset: earliest

mulebank:
  core-banking-url: ${CORE_BANKING_URL:http://127.0.0.1:8080}  # IPv4: core-banking listens on 127.0.0.1 only
  core-banking-password: ${RULE_ENGINE_PASSWORD:rule-engine-dev}  # this service's own login at core-banking
  passwords:  # who may read alerts here; local dev defaults, set the env vars anywhere else
    investigator: ${INVESTIGATOR_PASSWORD:investigator-dev}
    graph-service: ${GRAPH_SERVICE_PASSWORD:graph-service-dev}
